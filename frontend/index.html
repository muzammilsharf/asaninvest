<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asaninvest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Asaninvest</h1>
    <p>Pick a PSX stock and see its recent history plus an AI-based weekly return forecast.</p>
  </header>

  <main>
    <section class="selector-section">
      <label for="stock-select">Select a stock:</label>
      <select id="stock-select">
        <option value="">Loading stocks...</option>
      </select>
    </section>

    <section class="chart-section">
      <h2 id="chart-title">Price History</h2>
      <canvas id="price-chart"></canvas>
    </section>

    <section class="forecast-section">
      <h2>Forecast</h2>
      <div id="forecast-results">
        <p>Select a stock to see its forecast.</p>
      </div>
    </section>
  </main>

  <footer>
    <p class="disclaimer">
      Forecasts are generated by a model trained on historical PSX data and are for informational purposes only.
      This is not financial advice.
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
