name: Refresh PSX Data and Retrain Models

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Fetch latest data
        working-directory: backend
        run: uv run python fetch_data.py

      - name: Retrain models
        working-directory: backend
        run: uv run python train_model.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/cache backend/data/prediction_rows.csv backend/model
          git diff --staged --quiet || git commit -m "chore: daily data refresh and model retrain"
          git push